<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Burak AI - Automation Website</title>
  <!-- 1. React & ReactDOM (Modern React 18) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- 2. Babel (Allows writing JSX directly in HTML) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 3. Tailwind CSS (Modern styling utility) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased selection:bg-blue-600 selection:text-white">

  <!-- React Mount Point -->
  <div id="root" class="w-full max-w-lg"></div>

  <!-- React Application Code -->
  <script type="text/babel">
    function App() {
      // 1. React State Variables
      const [message, setMessage] = React.useState("Hello from Python + React Website!");
      const [loading, setLoading] = React.useState(false);
      const [response, setResponse] = React.useState(null);
      const [error, setError] = React.useState(null);
      const [logs, setLogs] = React.useState([
        { time: new Date().toLocaleTimeString(), text: "FastAPI Backend & React Frontend ready" }
      ]);

      // 2. Helper to log events in the UI
      const addLog = (text) => {
        setLogs(prev => [{ time: new Date().toLocaleTimeString(), text }, ...prev].slice(0, 10));
      };

      // 3. Trigger Automation Handler
      const handleTrigger = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError(null);
        setResponse(null);
        addLog("Sending trigger request to FastAPI backend (/api/trigger)...");

        try {
          // Call our Python FastAPI backend
          const res = await fetch("/api/trigger", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Automation execution failed");

          setResponse(data);
          addLog("Pipeline complete! Received response from n8n & Python backend.");
        } catch (err) {
          setError(err.message);
          addLog("Error: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      // 4. Render UI
      return (
        <div className="bg-slate-900 border border-slate-800 shadow-2xl rounded-3xl p-6 sm:p-8 space-y-6">
          
          {/* Header */}
          <div className="flex items-center justify-between border-b border-slate-800 pb-4">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20 text-white font-bold">
                ⚡
              </div>
              <div>
                <h1 className="text-lg font-bold text-white tracking-tight">Automation Dashboard</h1>
                <p className="text-xs text-slate-400">FastAPI (Python) • React 18 • n8n</p>
              </div>
            </div>
            <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              Live
            </span>
          </div>

          {/* Form */}
          <form onSubmit={handleTrigger} className="space-y-4">
            <div className="space-y-1.5">
              <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider">
                Payload Message
              </label>
              <input
                type="text"
                value={message}
                onChange={(e) => setMessage(e.target.value)}
                placeholder="Enter a message for the automation..."
                className="w-full bg-slate-950 border border-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 outline-none transition"
              />
            </div>

            <button
              type="submit"
              disabled={loading}
              className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.99] disabled:opacity-50 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-600/25 flex items-center justify-center space-x-2 transition cursor-pointer disabled:cursor-not-allowed text-sm"
            >
              {loading ? (
                <span>Executing Pipeline...</span>
              ) : (
                <span>Trigger Webhook 🚀</span>
              )}
            </button>
          </form>

          {/* Error Display */}
          {error && (
            <div className="bg-rose-950/40 border border-rose-800/60 rounded-xl p-3.5 text-xs text-rose-300 font-mono">
              ⚠️ {error}
            </div>
          )}

          {/* Response Display */}
          {response && (
            <div className="bg-emerald-950/30 border border-emerald-800/50 rounded-2xl p-4 space-y-2">
              <div className="text-xs font-semibold text-emerald-400 uppercase tracking-wider flex items-center justify-between">
                <span>Response from Backend</span>
                <span className="font-mono text-[10px] text-emerald-300">200 OK</span>
              </div>
              <pre className="text-xs font-mono text-emerald-200 bg-slate-950/90 p-3.5 rounded-xl overflow-x-auto border border-emerald-900/40">
                {JSON.stringify(response, null, 2)}
              </pre>
            </div>
          )}

          {/* Activity Logs */}
          <div className="space-y-2 pt-2 border-t border-slate-800">
            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">
              Real-time Logs
            </div>
            <div className="bg-slate-950 rounded-xl p-3 border border-slate-800 max-h-32 overflow-y-auto font-mono text-[11px] space-y-1">
              {logs.map((log, i) => (
                <div key={i} className="text-slate-400 flex items-start space-x-2">
                  <span className="text-slate-600">[{log.time}]</span>
                  <span className={i === 0 ? "text-blue-400 font-medium" : "text-slate-400"}>
                    {log.text}
                  </span>
                </div>
              ))}
            </div>
          </div>

        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
